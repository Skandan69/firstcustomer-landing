<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persistence Validation</title><style>body{font:15px system-ui;max-width:760px;margin:40px auto;padding:20px}button{padding:10px 14px;margin:4px}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:8px}.pass{color:#08783e}.fail{color:#b42318}@media(max-width:500px){body{margin:10px;padding:12px}button{width:100%}}</style></head><body><h1>PR #4 Persistence Validation</h1><button id="run">Run Live Validation</button><button id="refresh">Verify After Refresh</button><button id="cleanup">Clean Up</button><pre id="out">Ready</pre><script>
const out=document.querySelector('#out'),state=JSON.parse(sessionStorage.getItem('fc_validation')||'{}');const workspace=state.workspace||crypto.randomUUID();state.workspace=workspace;sessionStorage.setItem('fc_validation',JSON.stringify(state));
async function api(resource,{method='GET',id='',body,path='/api/persistence'}={}){const query=path.includes('validate')?'':`?resource=${resource}${id?`&id=${id}`:''}`;const r=await fetch(path+query,{method,headers:{'Content-Type':'application/json','X-Workspace-Id':workspace},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Object.assign(new Error(data.error?.message),{code:data.error?.code,status:r.status});return data;}
const line=(name,pass,detail='')=>`${pass?'PASS':'FAIL'} ${name}${detail?`: ${detail}`:''}`;
document.querySelector('#run').onclick=async()=>{const report=[];try{const business={provider:'openstreetmap',providerId:`validation-${Date.now()}`,name:'PR4 Validation Business',category:'Test',address:'Validation Road',city:'Hyderabad',state:'Telangana',country:'India',latitude:17.4,longitude:78.5,phone:'+919876543210',email:'test@example.invalid',website:'https://example.com',rating:null,reviewCount:null,businessStatus:''};let saved=await api('saved_leads',{method:'POST',body:{business}});state.leadId=saved.item.id;report.push(line('save lead',true));try{await api('saved_leads',{method:'POST',body:{business}});report.push(line('duplicate save handling',false));}catch(e){report.push(line('duplicate save handling',e.code==='DUPLICATE_RECORD',e.code));}let leads=await api('saved_leads');report.push(line('list saved leads',leads.items.some(x=>x.id===state.leadId)));let search=await api('saved_searches',{method:'POST',body:{name:`Validation ${Date.now()}`,location:'Hyderabad',category:'Cafe',radiusKm:2,provider:'open_data'}});state.searchId=search.item[0]?.id||search.item?.id;report.push(line('saved search',Boolean(state.searchId)));let note=await api('lead_notes',{method:'POST',body:{savedLeadId:state.leadId,content:'Initial validation note'}});state.noteId=note.item[0]?.id||note.item?.id;report.push(line('create note',Boolean(state.noteId)));let updated=await api('lead_notes',{method:'PATCH',id:state.noteId,body:{content:'Updated validation note'}});report.push(line('update note',updated.item?.content==='Updated validation note'));await api('activity_log',{method:'POST',body:{eventType:'viewed_business',metadata:{validation:true}}});report.push(line('activity log creation',true));let history=await api('',{method:'POST',path:'/api/persistence/validate'});state.historyId=history.item?.id;report.push(line('search history creation',Boolean(state.historyId)));sessionStorage.setItem('fc_validation',JSON.stringify(state));out.className=report.every(x=>x.startsWith('PASS'))?'pass':'fail';out.textContent=report.join('\n');}catch(e){out.className='fail';out.textContent=report.concat(line('workflow',false,`${e.code||e.status} ${e.message}`)).join('\n');}};
document.querySelector('#refresh').onclick=async()=>{try{const[leads,searches,history,activity]=await Promise.all([api('saved_leads'),api('saved_searches'),api('search_history'),api('activity_log')]);const report=[line('saved lead after refresh',leads.items.some(x=>x.id===state.leadId)),line('saved search after refresh',searches.items.some(x=>x.id===state.searchId)),line('history after refresh',history.items.some(x=>x.id===state.historyId)),line('activity after refresh',activity.items.some(x=>x.metadata?.validation===true))];out.className=report.every(x=>x.startsWith('PASS'))?'pass':'fail';out.textContent=report.join('\n');}catch(e){out.className='fail';out.textContent=line('refresh verification',false,e.message);}};
document.querySelector('#cleanup').onclick=async()=>{const report=[];try{if(state.noteId){await api('lead_notes',{method:'DELETE',id:state.noteId});report.push(line('delete note',true));}if(state.leadId){await api('saved_leads',{method:'DELETE',id:state.leadId});report.push(line('unsave lead',true));}if(state.searchId)await api('saved_searches',{method:'DELETE',id:state.searchId});if(state.historyId)await api('search_history',{method:'DELETE',id:state.historyId});out.className='pass';out.textContent=report.join('\n')+'\nCleanup complete';}catch(e){out.className='fail';out.textContent=line('cleanup',false,e.message);}};
</script></body></html>
